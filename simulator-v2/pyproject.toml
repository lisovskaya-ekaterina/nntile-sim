[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nntile-sim-v2"
version = "0.1.0"
requires-python = ">=3.10"
description = "Trace model for NNTile GPU-memory scheduling research"
[project.scripts]
nntile-trace = "nntile_sim.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
